mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  # 节点域名必须能在代理建立前直连解析，避免境外 DoH 不可达时
  # 出现“解析节点需要代理、建立代理又需要解析节点”的启动死锁。
  proxy-server-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - +.lan
  - +.local
  - time.*.com
  - ntp.*.com
  - +.market.xiaomi.com
  - +.push.apple.com
  # 系统联网探测与游戏 NAT 打洞域名需要真实 IP,fake-ip 会导致
  # 断网误判和 NAT 类型劣化。
  - +.msftconnecttest.com
  - +.msftncsi.com
  - dns.msftncsi.com
  - +.srv.nintendo.net
  - +.stun.playstation.net
  - +.xboxlive.com
  - stun.*.*
  - stun.*.*.*
  # DIRECT 规则依赖真实 IP,fake-ip 会导致该域名解析异常。
  - +.tokfinity.com
sniffer:
  enable: true
  parse-pure-ip: true
  # TLS/QUIC 只用于规则识别，不把应用已经选择的 CDN 目标改写成 SNI 域名；
  # HTTP 段在下方按协议显式开启改写。
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  # 避免局域网设备发现与 Apple Push 被 SNI 嗅探改写目标。
  skip-domain:
  - Mijia Cloud
  - +.push.apple.com
tun:
  enable: false
  stack: mixed
  dns-hijack:
  - any:53
  - tcp://any:53
  auto-route: true
  auto-detect-interface: true
proxy-groups:
- name: 默认代理
  type: select
  proxies:
  - 香港自动
  - 自动选择
  - 手动选择
  - DIRECT
- name: 自动选择
  type: url-test
  include-all: true
  url: https://cp.cloudflare.com/generate_204
  expected-status: 204
  timeout: 5000
  max-failed-times: 2
  lazy: true
  interval: 600
  tolerance: 150
- name: 手动选择
  type: select
  include-all: true
- name: 香港自动
  type: url-test
  include-all: true
  filter: (?i)(香港|🇭🇰|Hong Kong|(^|[^A-Za-z])(HK|HKG)([^A-Za-z]|$))
  url: https://cp.cloudflare.com/generate_204
  expected-status: 204
  timeout: 5000
  max-failed-times: 2
  lazy: true
  interval: 600
  tolerance: 150
- name: AI 服务
  type: select
  proxies:
  - AI自动
  - 默认代理
  - 自动选择
  - 手动选择
- name: AI自动
  # ChatGPT 可达性与通用 204 延迟不是一回事。只测试较近且通常支持 AI
  # 服务的新加坡节点，失败一次即重测；无新加坡节点时编译器会删除本组。
  type: url-test
  include-all: true
  filter: (?i)(新加坡|狮城|🇸🇬|Singapore|(^|[^A-Za-z])(SG|SIN)([^A-Za-z]|$))
  url: https://chatgpt.com/cdn-cgi/trace
  expected-status: 200
  timeout: 5000
  max-failed-times: 1
  lazy: true
  interval: 300
  tolerance: 50
- name: 流媒体
  type: select
  proxies: &service_proxies
  - 默认代理
  - 自动选择
  - 手动选择
  - DIRECT
- name: 社交通讯
  type: select
  proxies: *service_proxies
- name: 游戏服务
  type: select
  proxies: *service_proxies
- name: 开发服务
  type: select
  proxies:
  - 默认代理
  - 自动选择
  - DIRECT
  - 手动选择
- name: 金融服务
  type: select
  proxies:
  - 默认代理
  - 自动选择
  - 手动选择
- name: Google
  type: select
  proxies:
  - 默认代理
  - 自动选择
  - 手动选择
- name: Microsoft
  type: select
  proxies:
  - 默认代理
  - DIRECT
  - 自动选择
  - 手动选择
- name: Apple
  type: select
  proxies:
  - DIRECT
  - 默认代理
  - 自动选择
  - 手动选择
rule-providers:
  # 轻量核心：每项只保留一个固定版本的可信来源；classical YAML 可由
  # Surge 转换，AI domain 裸列表保留为 Mihomo 的广覆盖来源。
  ai-4:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/42c2a789e19516f0a8bb2bca8eb1541505599940/geo/geosite/category-ai-!cn.list
    path: ./rule_provider/leo/005.txt
    interval: 7200
  # Claude provider 是 Claude 策略子系统的产品契约依赖，不参与合并。
  Claude:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/8818705adee20571a856daf11c9fc69c4929109a/rule/Clash/Claude/Claude_No_Resolve.yaml
    path: ./rule_provider/leo/020.yaml
    interval: 86400
  GitHub-5:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/8818705adee20571a856daf11c9fc69c4929109a/rule/Clash/GitHub/GitHub_No_Resolve.yaml
    path: ./rule_provider/leo/158.yaml
    interval: 86400
  Apple-4:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/8818705adee20571a856daf11c9fc69c4929109a/rule/Clash/Apple/Apple_Classical_No_Resolve.yaml
    path: ./rule_provider/leo/101.yaml
    interval: 86400
  Google-2:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/8818705adee20571a856daf11c9fc69c4929109a/rule/Clash/Google/Google.yaml
    path: ./rule_provider/leo/169.yaml
    interval: 604800
  Microsoft-6:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/8818705adee20571a856daf11c9fc69c4929109a/rule/Clash/Microsoft/Microsoft_No_Resolve.yaml
    path: ./rule_provider/leo/211.yaml
    interval: 86400
  YouTube-6:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/8818705adee20571a856daf11c9fc69c4929109a/rule/Clash/YouTube/YouTube_No_Resolve.yaml
    path: ./rule_provider/leo/512.yaml
    interval: 86400
  Telegram:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/8818705adee20571a856daf11c9fc69c4929109a/rule/Clash/Telegram/Telegram_No_Resolve.yaml
    path: ./rule_provider/leo/515.yaml
    interval: 86400
