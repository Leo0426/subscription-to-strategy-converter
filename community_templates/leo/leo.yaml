mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  # 节点域名必须能在代理建立前直连解析，避免境外 DoH 不可达时
  # 出现“解析节点需要代理、建立代理又需要解析节点”的启动死锁。
  proxy-server-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - +.lan
  - +.local
  - time.*.com
  - ntp.*.com
  - +.market.xiaomi.com
  - +.push.apple.com
  # 系统联网探测与游戏 NAT 打洞域名需要真实 IP,fake-ip 会导致
  # 断网误判和 NAT 类型劣化。
  - +.msftconnecttest.com
  - +.msftncsi.com
  - dns.msftncsi.com
  - +.srv.nintendo.net
  - +.stun.playstation.net
  - +.xboxlive.com
  - stun.*.*
  - stun.*.*.*
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
tun:
  enable: false
  stack: mixed
  dns-hijack:
  - any:53
  - tcp://any:53
  auto-route: true
  auto-detect-interface: true
proxy-groups:
- name: 默认代理
  type: select
  proxies:
  - 香港自动
  - 自动选择
  - 故障转移
  - 台湾自动
  - 日本自动
  - 新加坡自动
  - 美国自动
  - 韩国自动
  - 欧洲自动
  - 手动选择
  - DIRECT
- name: 自动选择
  type: url-test
  include-all: true
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 150
- name: 故障转移
  type: fallback
  include-all: true
  url: https://www.gstatic.com/generate_204
  interval: 300
- name: 手动选择
  type: select
  include-all: true
- name: 香港自动
  type: url-test
  include-all: true
  filter: (?i)(香港|🇭🇰|Hong Kong|(^|[^A-Za-z])(HK|HKG)([^A-Za-z]|$))
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 150
- name: 台湾自动
  type: url-test
  include-all: true
  filter: (?i)(台湾|台北|台中|🇹🇼|Taiwan|(^|[^A-Za-z])(TW|TPE)([^A-Za-z]|$))
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 150
- name: 日本自动
  type: url-test
  include-all: true
  filter: (?i)(日本|东京|大阪|🇯🇵|Japan|(^|[^A-Za-z])(JP|NRT|HND)([^A-Za-z]|$))
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 150
- name: 新加坡自动
  type: url-test
  include-all: true
  filter: (?i)(新加坡|狮城|🇸🇬|Singapore|(^|[^A-Za-z])(SG|SIN)([^A-Za-z]|$))
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 150
- name: 美国自动
  type: url-test
  include-all: true
  filter: (?i)(美国|美國|🇺🇸|United States|(^|[^A-Za-z])(US|USA|LAX|SJC|SFO)([^A-Za-z]|$))
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 150
- name: 韩国自动
  type: url-test
  include-all: true
  filter: (?i)(韩国|韓國|首尔|首爾|🇰🇷|Korea|(^|[^A-Za-z])KR([^A-Za-z]|$))
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 150
- name: 欧洲自动
  type: url-test
  include-all: true
  filter: (?i)(英国|法國|法国|德国|德國|荷兰|荷蘭|瑞士|欧洲|歐洲|🇬🇧|🇫🇷|🇩🇪|(^|[^A-Za-z])(UK|GB|DE|FR|EU)([^A-Za-z]|$))
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 150
